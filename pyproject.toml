[project]
name = "tellfold"
version = "0.1.0"
description = "Local swarm simulation: seed documents in, simulated social reaction and a prediction report out. Powered by your local Claude Code CLI."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "anyio>=4.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pymupdf>=1.24",
    "charset-normalizer>=3.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "httpx>=0.28.1",
]

[project.scripts]
tellfold = "tellfold.cli:app"
# Deprecated: the CLI was called `shoal` before the rename. Prints a notice, then runs `tellfold`.
shoal = "tellfold.cli:legacy_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tellfold"]

[tool.hatch.build.targets.wheel.force-include]
"tellfold/templates" = "tellfold/templates"
"tellfold/web" = "tellfold/web"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
