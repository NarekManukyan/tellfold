# Tests the Rust engine (engine-rs/), which the Mac app bundles, and the Rust tooling next to it (the benchmark
# harness and the brand generator).
name: Engine (Rust)

on:
  pull_request:
    paths:
      - "engine-rs/**"
      - "bench/**"
      - "brand/**"
      - "mac/scripts/bundle-engine.sh"
      - "mac/project.yml"
      - ".github/workflows/engine-rs.yml"
  push:
    branches: [main]
    paths:
      - "engine-rs/**"
      - "bench/**"
      - "brand/**"
      - "mac/scripts/bundle-engine.sh"
      - "mac/project.yml"
      - ".github/workflows/engine-rs.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The oldest Rust the workspace declares (rust-version in engine-rs/Cargo.toml) still builds the locked tree.
  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      - run: cargo check --workspace --all-targets --locked

  # The binary the app ships: Apple silicon, macOS 15, built and smoke-tested by the app's own script.
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      - run: mac/scripts/bundle-engine.sh . "$RUNNER_TEMP/engine"
