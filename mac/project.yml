# XcodeGen spec for Tellfold for Mac. Generate the project with `xcodegen generate` in this folder;
# Tellfold.xcodeproj is a build product: never hand-edit it.
name: Tellfold

options:
  bundleIdPrefix: dev.tellfold
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_TESTABILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO

targets:
  Tellfold:
    type: application
    platform: macOS
    sources:
      - path: Tellfold
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
    info:
      path: Tellfold/App/Info.plist
      properties:
        CFBundleName: Tellfold
        CFBundleDisplayName: Tellfold
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSUserNotificationsUsageDescription: Tellfold tells you when a simulation finishes or fails.
        NSRemovableVolumesUsageDescription: Tellfold runs its simulation engine and keeps runs in folders you choose, which can be on an external drive.
        NSDocumentsFolderUsageDescription: Tellfold reads seed documents and keeps runs in folders you choose.
        NSDownloadsFolderUsageDescription: Tellfold reads seed documents you choose from Downloads.
        NSDesktopFolderUsageDescription: Tellfold reads seed documents you choose from the Desktop.
        # Lets the app accept seed files dropped on its Dock icon and opened with File > Open.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Seed document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
              - com.adobe.pdf
    entitlements:
      path: Tellfold/App/Tellfold.entitlements
      properties:
        # The app spawns `uv` and local agent CLIs, so it cannot run in the App Sandbox.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tellfold.mac
        PRODUCT_NAME: Tellfold
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Bundle engine (Release)
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          # Release builds carry the Python engine source in Resources/engine; Debug runs it from the repo.
          if [ "${CONFIGURATION}" != "Release" ]; then exit 0; fi
          ENGINE_SRC="${PROJECT_DIR}/.."
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/engine"
          mkdir -p "${DEST}"
          rsync -a --delete --exclude "__pycache__" --exclude "*.pyc" "${ENGINE_SRC}/tellfold" "${DEST}/"
          cp "${ENGINE_SRC}/pyproject.toml" "${DEST}/pyproject.toml"
          if [ -f "${ENGINE_SRC}/uv.lock" ]; then cp "${ENGINE_SRC}/uv.lock" "${DEST}/uv.lock"; fi
          if [ -f "${ENGINE_SRC}/README.md" ]; then cp "${ENGINE_SRC}/README.md" "${DEST}/README.md"; fi

  TellfoldTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TellfoldTests
        excludes:
          - "Fixtures/**"
      - path: TellfoldTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Tellfold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tellfold.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tellfold.app/Contents/MacOS/Tellfold"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Tellfold:
    build:
      targets:
        Tellfold: all
        TellfoldTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TellfoldTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
