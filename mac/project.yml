# XcodeGen spec for Tellfold for Mac. Generate the project with `xcodegen generate` in this folder;
# Tellfold.xcodeproj is a build product: never hand-edit it.
name: Tellfold

options:
  bundleIdPrefix: dev.tellfold
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  # In-app updates (Tellfold > Check for Updates…), fed from site/appcast.xml.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    # The release script sets both; CURRENT_PROJECT_VERSION must grow with every release for Sparkle to see it.
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_TESTABILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO

targets:
  Tellfold:
    type: application
    platform: macOS
    sources:
      - path: Tellfold
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
          - "Resources/Examples/**"
      # Finished example runs the engine lists read-only (`tellfold serve --examples`), copied as one folder.
      - path: Tellfold/Resources/Examples
        type: folder
        buildPhase: resources
      # The fictional seed documents behind "Start from an example" on the New simulation sheet.
      - path: ../examples
        # no intermediate group for "..": XcodeGen names it after the checkout folder, so every worktree rewrote
        # project.pbxproj (and parallel branches conflicted on it)
        createIntermediateGroups: false
        buildPhase: resources
        excludes:
          - "*.sh"
    dependencies:
      - package: Sparkle
    info:
      path: Tellfold/App/Info.plist
      properties:
        CFBundleName: Tellfold
        CFBundleDisplayName: Tellfold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Narek Manukyan. All rights reserved."
        SUFeedURL: https://tellfold-stats.tellfold.workers.dev/appcast.xml
        SUPublicEDKey: rs9GpYpqyBTNCp+pETdBDGCuN4E1999sSay08HsVHM0=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        NSUserNotificationsUsageDescription: Tellfold tells you when a simulation finishes or fails.
        NSRemovableVolumesUsageDescription: Tellfold runs its simulation engine and keeps runs in folders you choose, which can be on an external drive.
        NSDocumentsFolderUsageDescription: Tellfold reads seed documents and keeps runs in folders you choose.
        NSDownloadsFolderUsageDescription: Tellfold reads seed documents you choose from Downloads.
        NSDesktopFolderUsageDescription: Tellfold reads seed documents you choose from the Desktop.
        # Lets the app accept seed files dropped on its Dock icon and opened with File > Open, and open the `.tellfold`
        # run bundles it exports (double-click, File > Open, a drop on the Dock icon or the window).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Seed document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
              - com.adobe.pdf
          - CFBundleTypeName: Tellfold run
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - dev.tellfold.run-bundle
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.tellfold.run-bundle
            UTTypeDescription: Tellfold run
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - tellfold
              public.mime-type:
                - application/vnd.tellfold.run+zip
    entitlements:
      path: Tellfold/App/Tellfold.entitlements
      properties:
        # The app spawns its engine and local agent CLIs, so it cannot run in the App Sandbox.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tellfold.mac
        PRODUCT_NAME: Tellfold
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # The bundled engine is built for Apple silicon only.
          ARCHS: arm64
    postBuildScripts:
      - name: Bundle engine
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          # Every build carries the Rust engine in Resources/engine. Settings > Advanced > Engine path runs another
          # tellfold build instead.
          "${PROJECT_DIR}/scripts/bundle-engine.sh" "${PROJECT_DIR}/.." \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/engine" "${EXPANDED_CODE_SIGN_IDENTITY:--}"

  TellfoldTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TellfoldTests
        excludes:
          - "Fixtures/**"
      - path: TellfoldTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Tellfold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tellfold.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tellfold.app/Contents/MacOS/Tellfold"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Tellfold:
    build:
      targets:
        Tellfold: all
        TellfoldTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TellfoldTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
