[package]
name = "tellfold-server"
description = "The Tellfold Studio HTTP API and run manager (port of tellfold/server)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
httpdate = "1"
percent-encoding = "2"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tellfold-engine.workspace = true
tellfold-llm.workspace = true
tellfold-models.workspace = true
tellfold-report.workspace = true
tellfold-runtimes.workspace = true
tellfold-store.workspace = true
tellfold-study.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "fs"] }
unicode-normalization.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["multipart"] }
