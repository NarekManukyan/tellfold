[workspace]
resolver = "2"
members = ["crates/tellfold-models", "crates/tellfold-store", "crates/tellfold-llm", "crates/tellfold-runtimes", "crates/tellfold-engine", "crates/tellfold-report", "crates/tellfold-study", "crates/tellfold-server", "crates/tellfold-cli", "crates/tellfold-bench"]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart", "query"] }
chardetng = "0.1"
encoding_rs = "0.8"
futures = "0.3"
pdf-extract = "0.7"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
thiserror = "1"
rand = "0.8"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
fancy-regex = "0.14"
minijinja = { version = "2", default-features = false, features = ["builtins", "macros", "multi_template", "serde", "std_collections", "adjacent_loop_items"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
sha2 = "0.10"
unicode-normalization = "0.1"
# .tellfold run bundles: deflate only, through flate2's pure-Rust backend
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tellfold-models = { path = "crates/tellfold-models" }
tellfold-store = { path = "crates/tellfold-store" }
tellfold-llm = { path = "crates/tellfold-llm" }
tellfold-runtimes = { path = "crates/tellfold-runtimes" }
tellfold-engine = { path = "crates/tellfold-engine" }
tellfold-report = { path = "crates/tellfold-report" }
tellfold-study = { path = "crates/tellfold-study" }
tellfold-server = { path = "crates/tellfold-server" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug builds of the Mac app (mac/scripts/bundle-engine.sh): optimised like a release, without the slow
# link-time optimisation, so a Rust edit does not stall the Swift edit-build loop.
[profile.app-debug]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
