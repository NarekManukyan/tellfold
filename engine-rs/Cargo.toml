[workspace]
resolver = "2"
members = ["crates/tellfold-models", "crates/tellfold-store", "crates/tellfold-llm"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
async-trait = "0.1"
chardetng = "0.1"
encoding_rs = "0.8"
futures = "0.3"
pdf-extract = "0.7"
tokio = { version = "1", features = ["sync", "time", "rt"] }
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
thiserror = "1"
rand = "0.8"
tellfold-models = { path = "crates/tellfold-models" }
tellfold-store = { path = "crates/tellfold-store" }
tellfold-llm = { path = "crates/tellfold-llm" }

[profile.release]
lto = true
codegen-units = 1
strip = true
