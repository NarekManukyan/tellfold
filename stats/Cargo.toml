[package]
name = "tellfold-stats"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
description = "Counts update checks from the Mac app and visits to the site, and nothing else."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.9", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
