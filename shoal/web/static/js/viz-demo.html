<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoal viz demo</title>
<!-- Manual test page for network.js / kgraph.js / charts.js. Synthetic data: 60 agents, 6 rounds.
     Serve over http (ES modules do not load from file://), e.g. `shoal ui` then open /static/js/viz-demo.html,
     or `python -m http.server` in shoal/web/static and open /js/viz-demo.html. -->
<style>
  :root {
    --ink-0: #0a1018; --ink-1: #101924; --ink-2: #182333; --line: #273345;
    --text: #e3eaf2; --text-dim: #8b98a9; --accent: #7cc4ff;
    --sent-neg: #f0896b; --sent-neu: #97a3b1; --sent-pos: #39c9b8;
    --event: #f2c14e; --like: #5fd3c0; --dislike: #f0896b; --reply: #7cc4ff; --repost: #b49cff; --follow: #c3ccd8;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink-0: #f7f9fb; --ink-1: #ffffff; --ink-2: #eaeef3; --line: #d3dae3;
    --text: #17202b; --text-dim: #566273; --accent: #1f6fb2;
    --sent-neg: #c8553a; --sent-neu: #7d8896; --sent-pos: #0d8a7c;
    --event: #a86b00; --like: #0d8a7c; --dislike: #c8553a; --reply: #1f6fb2; --repost: #6a4dc4; --follow: #4a5565;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink-0); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr 170px; height: 100vh; gap: 1px;
    background: var(--line); }
  header { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--ink-1); flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; }
  header button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--ink-2); color: var(--text); cursor: pointer; }
  header button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #log { margin-left: auto; font-family: ui-monospace, Menlo, monospace; color: var(--text-dim); font-size: 12px; }
  .pane { position: relative; background: var(--ink-0); min-height: 0; overflow: hidden; padding: 12px; }
  .pane.kg { background: var(--ink-1); }
  .tl { grid-column: 1 / -1; background: var(--ink-1); padding: 10px 12px 6px; }
  .label { position: absolute; top: 12px; left: 12px; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .08em;
    color: var(--text-dim); z-index: 3; pointer-events: none; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1fr 170px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Shoal viz demo</h1>
    <button id="play">Play next round</button>
    <button id="event">Inject event</button>
    <button id="select">Select random agent</button>
    <button id="theme">Toggle theme</button>
    <span id="log">ready</span>
  </header>
  <div class="pane"><span class="label">NETWORK</span><canvas id="net"></canvas></div>
  <div class="pane kg"><span class="label">KNOWLEDGE GRAPH</span><canvas id="kg"></canvas></div>
  <div class="tl" id="timeline"></div>
</div>
<script type="module">
import { NetworkView } from './network.js';
import { KnowledgeGraphView } from './kgraph.js';
import { Timeline } from './charts.js';

// ---------------- synthetic data (seeded RNG, deterministic)
let seed = 42;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const N = 60, ROUNDS = 6;

const kinds = ['person', 'organization', 'group', 'product', 'place', 'concept', 'event'];
const entityNames = ['Northwind Transit', 'City Council', 'Riders Union', 'Fare Card 2', 'Harbor District', 'Congestion pricing',
  'Budget vote', 'Mayor Ortiz', 'Local Press', 'Cyclists Coalition', 'Metro Line 4', 'Downtown', 'Equity', 'Strike notice',
  'Dr. Patel', 'Chamber of Commerce', 'Students', 'Night buses', 'Suburbs', 'Climate goals', 'Public hearing', 'TransitApp', 'Unions', 'Ferry'];
const entities = entityNames.map((name, i) => ({
  id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), name, kind: kinds[i % kinds.length],
  summary: `${name} is a synthetic entity used to exercise the knowledge graph view.`, source_chunk_ids: [i],
}));
const verbs = ['funds', 'opposes', 'supports', 'operates', 'covers', 'regulates', 'competes with', 'serves', 'criticises'];
const relations = [];
for (let i = 0; i < 40; i++) {
  const a = pick(entities), b = pick(entities);
  if (a !== b) relations.push({ source: a.id, target: b.id, label: pick(verbs), evidence: `Evidence sentence ${i} from the seed document.` });
}
relations.push({ source: entities[1].id, target: entities[0].id, label: 'oversees' }, { source: entities[0].id, target: entities[1].id, label: 'reports to' });
const graph = { entities, relations };

const first = ['ana', 'ben', 'chen', 'dara', 'eli', 'fay', 'gus', 'hana', 'ivo', 'jun', 'kai', 'lea', 'mo', 'nia', 'omar'];
const personas = Array.from({ length: N }, (_, i) => {
  const id = 'a' + String(i + 1).padStart(2, '0');
  const ent = i < 6 ? entities[[0, 1, 2, 7, 8, 15][i]] : null;
  return {
    id, handle: ent ? ent.id.replace(/-/g, '_') : `${pick(first)}_${i}`,
    name: ent ? ent.name : `Person ${i + 1}`, bio: 'Synthetic persona.', background: '', stance: '',
    traits: [pick(['skeptical', 'curious', 'loyal', 'contrarian'])],
    activity: 0.3 + rnd() * 0.6, influence: ent ? 0.75 + rnd() * 0.25 : rnd() * 0.7, entity_id: ent ? ent.id : null,
  };
});
// initial follow graph: preferential attachment toward influential accounts
const follows = [];
const fset = new Set();
const addF = (a, b) => { const k = a + '>' + b; if (a !== b && !fset.has(k)) { fset.add(k); follows.push([a, b]); } };
for (const p of personas) {
  const k = 2 + Math.floor(rnd() * 4);
  for (let j = 0; j < k; j++) {
    const t = rnd() < 0.55 ? personas[Math.floor(rnd() * 6)] : personas[Math.floor(rnd() ** 1.6 * N)];
    addF(p.id, t.id);
  }
}

// rounds: posts + actions + stats
const allPosts = [];
const actionsByRound = new Map();
const stats = [];
const bias = personas.map(() => (rnd() - 0.5) * 1.2);
const events = [{ round: 2, content: 'The council announces a 40% fare increase starting next month.' },
  { round: 4, content: 'Transit workers file a strike notice.' }];
let postId = 1;
for (let r = 0; r <= ROUNDS; r++) {
  const drift = r >= 2 ? -0.35 : 0;
  const acts = [];
  const counts = {};
  const active = new Set();
  const roundPosts = [];
  for (const p of personas) {
    if (r > 0 && rnd() > p.activity) continue;
    active.add(p.id);
    const nAct = r === 0 ? 1 : 1 + Math.floor(rnd() * 2);
    for (let j = 0; j < nAct; j++) {
      const type = r === 0 ? 'post' : pick(['post', 'reply', 'reply', 'repost', 'like', 'like', 'like', 'dislike', 'follow']);
      const prev = allPosts.filter((x) => x.round < r);
      const target = prev.length ? pick(prev) : null;
      const a = { round: r, agent_id: p.id, type, target_post_id: null, target_agent_id: null, content: '', reasoning: '' };
      if (['reply', 'repost', 'like', 'dislike'].includes(type)) { if (!target) continue; a.target_post_id = target.id; }
      if (type === 'follow') {
        const t = personas[Math.floor(rnd() ** 1.4 * N)];
        if (t.id === p.id || fset.has(p.id + '>' + t.id)) continue;
        a.target_agent_id = t.id; addF(p.id, t.id);
      }
      acts.push(a);
      counts[type] = (counts[type] || 0) + 1;
      if (['post', 'reply', 'repost'].includes(type)) {
        const s = Math.max(-1, Math.min(1, bias[+p.id.slice(1) - 1] + drift + (rnd() - 0.5) * 0.6));
        const post = { id: postId++, round: r, author_id: p.id, author_handle: p.handle, content: '...', sentiment: s,
          parent_id: type === 'reply' ? a.target_post_id : null, repost_of: type === 'repost' ? a.target_post_id : null,
          likes: 0, dislikes: 0, reposts: 0, replies: 0 };
        roundPosts.push(post);
      }
    }
  }
  allPosts.push(...roundPosts);
  actionsByRound.set(r, acts);
  const ss = roundPosts.map((p) => p.sentiment);
  stats.push({ round: r, actions: counts, new_posts: roundPosts.length, active_agents: active.size,
    sentiment: ss.length ? ss.reduce((a, b) => a + b, 0) / ss.length : null, llm_calls: 10, llm_seconds: 30 });
}
const allActions = [...actionsByRound.values()].flat();

function sentimentAt(r) {
  const acc = {};
  for (const p of allPosts) {
    if (p.round > r || p.sentiment == null) continue;
    (acc[p.author_id] ||= []).push(p.sentiment);
  }
  const out = {};
  for (const p of personas) out[p.id] = acc[p.id] ? acc[p.id].reduce((a, b) => a + b, 0) / acc[p.id].length : null;
  return out;
}

// ---------------- wire up
const log = (m) => { document.getElementById('log').textContent = m; };
const net = new NetworkView(document.getElementById('net'), {
  onSelectAgent: (id) => log(`selected agent ${id}`),
  onHoverAgent: (id) => id && log(`hover ${id}`),
});
const kg = new KnowledgeGraphView(document.getElementById('kg'), { onSelectEntity: (id) => log(`selected entity ${id}`) });
let shown = 0;
let timer = null;
let speed = 1;
const tl = new Timeline(document.getElementById('timeline'), {
  onScrub: (r) => { stopPlay(); shown = r; showStatic(r); log(`scrub → round ${r}`); },
  onPlayToggle: (playing) => (playing ? startPlay() : stopPlay()),
  onSpeed: (s) => { speed = s; log(`speed ${s}×`); },
});

net.setData({ personas, follows, sentimentByAgent: sentimentAt(ROUNDS), posts: allPosts, actions: allActions });
kg.setData(graph, personas);
tl.setData({ stats, events, totalRounds: ROUNDS });
showStatic(0);
tl.setPlayhead(0);

function showStatic(r) {
  net.setData({ personas, follows, sentimentByAgent: sentimentAt(r) });
  net.setRound(r);
}
function playRound(r) {
  net.setData({ personas, follows, sentimentByAgent: sentimentAt(r) });
  const ev = events.find((e) => e.round === r);
  if (ev) net.showEvent(ev.content);
  net.playRound(r, actionsByRound.get(r), allPosts.filter((p) => p.round === r));
  tl.setPlayhead(r);
  log(`round ${r}: ${actionsByRound.get(r).length} actions`);
}
function startPlay() {
  if (shown >= ROUNDS) shown = -1;
  tl.setPlaying(true);
  const tick = () => {
    if (shown >= ROUNDS) { stopPlay(); return; }
    playRound(++shown);
    timer = setTimeout(tick, 2500 / speed);
  };
  tick();
}
function stopPlay() { clearTimeout(timer); timer = null; tl.setPlaying(false); }

document.getElementById('play').onclick = () => { stopPlay(); shown = shown >= ROUNDS ? 0 : shown + 1; playRound(shown); };
document.getElementById('event').onclick = () => net.showEvent('A synthetic breaking-news event ripples through the crowd.');
document.getElementById('select').onclick = () => { const p = pick(personas); net.select(p.id); log(`select(${p.id})`); };
document.getElementById('theme').onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
  document.dispatchEvent(new CustomEvent('studio:themechange'));
};
window.__demo = { net, kg, tl, personas, follows, allPosts, actionsByRound, stats };
</script>
</body>
</html>
