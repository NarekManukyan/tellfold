# The update feed Worker. Deploy from this folder with `npx wrangler@4 deploy`; README.md has the rest.
name = "tellfold-feed"
main = "build/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[build]
command = "cargo install -q worker-build@0.9.0 --locked && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "tellfold-feed"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
